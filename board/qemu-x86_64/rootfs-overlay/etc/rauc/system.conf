[system]
compatible=qemu-ota-recovery-lab-x86_64
bootloader=grub
grubenv=/boot/EFI/BOOT/grubenv
mountprefix=/mnt/rauc
data-directory=/data/rauc
# Non-streaming RAUC defaults to only 8 MiB.  Keep the first lesson simple and
# allow a complete bundle download; HTTP range/NBD streaming is a later stage.
max-bundle-download-size=536870912
bundle-formats=-plain

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.recovery.0]
device=/dev/vda1
type=raw
bootname=R
readonly=true

[slot.rootfs.0]
device=/dev/vda2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/vda3
type=ext4
bootname=B
