image efi-part.vfat {
    vfat {
        label = "OTA-BOOT"
        file EFI {
            image = "efi-part/EFI"
        }
    }

    size = 256M
}
image disk.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition boot {
        image = "efi-part.vfat"
        partition-type-uuid = U
        offset = 1M
        bootable = true
    }

    partition rootfs-a {
        image = "rootfs.ext4"
        partition-type-uuid = L
    }

    partition rootfs-b {
        image = "rootfs.ext4"
        partition-type-uuid = L
    }

    partition data {
        image = "data.ext4"
        partition-type-uuid = L
    }
}
