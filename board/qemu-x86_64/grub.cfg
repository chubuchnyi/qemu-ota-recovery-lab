set default=0
set timeout=3

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

set ORDER="A B"
set A_OK=0
set B_OK=0
set R_OK=1
set A_TRY=0
set B_TRY=0
set R_TRY=0
set A_HASH=""
set B_HASH=""
set A_HASH_OFFSET=""
set B_HASH_OFFSET=""
load_env --file=(hd0,gpt1)/EFI/BOOT/grubenv

set any_ok=0
for SLOT in $ORDER; do
    if [ "$SLOT" = "A" ]; then
        set INDEX=1
        set OK=$A_OK
        set TRY=$A_TRY
        set A_TRY=1
    fi
    if [ "$SLOT" = "B" ]; then
        set INDEX=2
        set OK=$B_OK
        set TRY=$B_TRY
        set B_TRY=1
    fi
    if [ "$OK" = "1" -a "$TRY" = "0" ]; then
        set default=$INDEX
        set any_ok=1
        break
    fi
done

# If neither normal slot is bootable, menu entry zero is the RAM-only recovery.
if [ "$any_ok" = "0" ]; then
    set default=0
fi

save_env --file=(hd0,gpt1)/EFI/BOOT/grubenv A_TRY B_TRY

set cmdline="console=ttyS0,115200 panic=5 rootwait"

menuentry "Recovery (RAM only)" {
    linux /EFI/BOOT/bzImage $cmdline rdinit=/sbin/init ota.mode=recovery rauc.slot=R
    initrd /EFI/BOOT/recovery.cpio.gz
}

menuentry "Slot A" {
    linux (hd0,gpt2)/boot/bzImage root=/dev/mapper/ota-root ro $cmdline \
        rdinit=/sbin/ota-verity-init rauc.slot=A \
        ota.verity-data=/dev/vda2 ota.verity-hash-offset=$A_HASH_OFFSET \
        ota.verity-root-hash=$A_HASH
    initrd /EFI/BOOT/recovery.cpio.gz
}

menuentry "Slot B" {
    linux (hd0,gpt3)/boot/bzImage root=/dev/mapper/ota-root ro $cmdline \
        rdinit=/sbin/ota-verity-init rauc.slot=B \
        ota.verity-data=/dev/vda3 ota.verity-hash-offset=$B_HASH_OFFSET \
        ota.verity-root-hash=$B_HASH
    initrd /EFI/BOOT/recovery.cpio.gz
}
